site_name: IOTA Rebased Developer Guide
site_description: The definitive AI-ready developer guide for IOTA Rebased
site_url: https://muyamipesar.github.io/iota-rebased/
repo_url: https://github.com/muyamipesar/iota-rebased
repo_name: muyamipesar/iota-rebased

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Getting Started:
    - Architecture: references/architecture.md
    - Legacy vs Rebased: references/old-vs-new.md
    - Networks & Endpoints: references/networks.md
    - Wallets: references/wallets.md
    - Migration from Stardust: references/migration.md
  - Move Language:
    - Move Basics: references/move-basics.md
    - Advanced Patterns: references/move-advanced.md
    - Objects & Fields: references/move-objects-fields.md
    - DeFi & Tokens: references/move-defi.md
    - Testing: references/move-testing.md
    - Security: references/move-security.md
    - Gas Optimization: references/move-gas.md
    - IOTA vs Sui Move: references/move-vs-sui.md
  - Development:
    - Smart Contracts: references/smart-contracts.md
    - SDKs & Tools: references/sdks-tools.md
    - EVM / Solidity (L2): references/evm-layer2.md
  - Ecosystem:
    - Tokenomics: references/tokenomics.md
    - Staking: references/staking.md
    - Identity (DID): references/identity.md
    - TWIN (Digital Trade): references/twin.md
    - Roadmap & Starfish: references/roadmap-starfish.md
    - Resources & Community: references/ecosystem.md
